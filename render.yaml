services:
  - type: web
    name: copiloto-hibrido-btc-actinver
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python copiloto_maestro_runner.py
    plan: free
    autoDeploy: true
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: LIVE_TRADING_ENABLED
        value: "false"
      - key: CAPITAL_PER_TRADE_USDC
        value: "10.00"
      - key: NIGHT_SILENCE_ENABLED
        value: "true"
      - key: COMPOUNDING_ENABLED
        value: "true"
