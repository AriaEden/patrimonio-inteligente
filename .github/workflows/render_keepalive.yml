name: Render 24/7 Keep-Alive Robot

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Cloud Service
        run: |
          echo "Pinging Copiloto Hibrido on Render to prevent idle spin-down..."
          curl -sS --max-time 30 https://copiloto-inversion-hibrido.onrender.com/ || true
          echo "Keep-alive ping dispatched successfully."
